  <text x="890" y="228" font-family="Arial" font-size="22" font-weight="900" fill="#17201B">30 MIN</text>
  <rect x="1200" y="650" width="150" height="60" rx="3" fill="#FF7652"/>
  <text x="1275" y="687" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#FFFFFF">KEEP MOVING</text>
 </g>

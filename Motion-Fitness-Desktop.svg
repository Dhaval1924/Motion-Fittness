 <rect x="1190" y="24" width="165" height="52" rx="4" fill="#17201B"/>
 <text x="1272" y="56" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1" fill="#FFFFFF">JOIN MOTION ↗</text>
</g>

 <circle cx="1135" cy="470" r="310" fill="#26352D"/>
 <circle cx="1135" cy="470" r="245" fill="none" stroke="#435349" stroke-width="1.5"/>
 <circle cx="1135" cy="470" r="190" fill="none" stroke="#435349" stroke-width="1.5" stroke-dasharray="6 12"/>
 <text x="90" y="225" font-family="Arial" font-size="15" font-weight="700" letter-spacing="4" fill="#FF805C">TRAIN WITH PURPOSE</text>
 <text x="90" y="345" font-family="Arial" font-size="86" font-weight="900" letter-spacing="-4" fill="#F5F2EA">MAKE</text>
 <text x="90" y="440" font-family="Arial" font-size="86" font-weight="900" letter-spacing="-4" fill="#F5F2EA">YOUR</text>
 <text x="90" y="535" font-family="Arial" font-size="86" font-weight="900" letter-spacing="-4" fill="#FF7652">MOVE.</text>
 <text x="95" y="610" font-family="Arial" font-size="21" fill="#C2CBC2">A practical fitness space for real people.</text>
 <text x="95" y="644" font-family="Arial" font-size="21" fill="#C2CBC2">Build strength, find your rhythm, and keep going.</text>
 <rect x="90" y="700" width="210" height="62" rx="3" fill="url(#orange)"/>
 <text x="195" y="739" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" letter-spacing="1" fill="#FFFFFF">FIND YOUR PLAN ↗</text>
 <text x="330" y="739" font-family="Arial" font-size="15" font-weight="700" fill="#F5F2EA">SEE HOW IT WORKS ↓</text>
 <!-- graphic athlete -->
 <g id="HeroGraphic">
  <path d="M1040 300 C1080 230 1190 240 1220 330 L1270 510 L1180 555 L1110 430 L1045 560 L950 520 Z" fill="#F05A3B"/>

<!-- Intro stats -->
<g id="Stats">
 <rect y="860" width="1440" height="210" fill="#FF7652"/>
 <text x="90" y="930" font-family="Arial" font-size="14" font-weight="800" letter-spacing="3" fill="#612A1D">THE MOTION WAY</text>
 <text x="90" y="990" font-family="Arial" font-size="35" font-weight="900" fill="#17201B">Fitness that fits real life.</text>
 <path d="M670 900V1020M925 900V1020M1170 900V1020" stroke="#D94E32" stroke-width="2"/>
 <text x="725" y="955" font-family="Arial" font-size="34" font-weight="900" fill="#17201B">15+</text><text x="725" y="985" font-family="Arial" font-size="14" font-weight="700" fill="#612A1D">WORKOUT STYLES</text>
 <text x="980" y="955" font-family="Arial" font-size="34" font-weight="900" fill="#17201B">20–30</text><text x="980" y="985" font-family="Arial" font-size="14" font-weight="700" fill="#612A1D">MINUTES A DAY</text>
 <text x="1220" y="955" font-family="Arial" font-size="34" font-weight="900" fill="#17201B">ALL</text><text x="1220" y="985" font-family="Arial" font-size="14" font-weight="700" fill="#612A1D">FITNESS LEVELS</text>
</g>
<!-- Feature section -->
<g id="Features">
 <rect y="1070" width="1440" height="560" fill="#F5F2EA"/>
 <text x="90" y="1170" font-family="Arial" font-size="14" font-weight="800" letter-spacing="3" fill="#F05A3B">WHAT YOU GET</text>
 <text x="90" y="1230" font-family="Arial" font-size="48" font-weight="900" letter-spacing="-1" fill="#17201B">A better routine starts here.</text>
 <text x="90" y="1275" font-family="Arial" font-size="18" fill="#687269">No complicated rules. Just the tools to help you show up.</text>
 <g filter="url(#shade)">
  <rect x="90" y="1330" width="390" height="230" rx="4" fill="#FFFFFF"/>
  <rect x="525" y="1330" width="390" height="230" rx="4" fill="#FFFFFF"/>
  <rect x="960" y="1330" width="390" height="230" rx="4" fill="#FFFFFF"/>
 </g>
 <rect x="90" y="1330" width="390" height="9" fill="#F05A3B"/><rect x="525" y="1330" width="390" height="9" fill="#17201B"/><rect x="960" y="1330" width="390" height="9" fill="#F05A3B"/>
 <text x="125" y="1400" font-family="Arial" font-size="13" font-weight="800" letter-spacing="2" fill="#F05A3B">01 / TRAIN</text>
 <text x="125" y="1450" font-family="Arial" font-size="25" font-weight="900" fill="#17201B">Workouts for you</text>
 <text x="125" y="1490" font-family="Arial" font-size="16" fill="#687269">Choose routines that match your</text><text x="125" y="1517" font-family="Arial" font-size="16" fill="#687269">goals, time, and experience.</text>
 <text x="560" y="1400" font-family="Arial" font-size="13" font-weight="800" letter-spacing="2" fill="#F05A3B">02 / FUEL</text>
 <text x="560" y="1450" font-family="Arial" font-size="25" font-weight="900" fill="#17201B">Everyday wellness</text>
 <text x="560" y="1490" font-family="Arial" font-size="16" fill="#687269">Simple tips to support better</text><text x="560" y="1517" font-family="Arial" font-size="16" fill="#687269">habits, rest, and recovery.</text>
 <text x="995" y="1400" font-family="Arial" font-size="13" font-weight="800" letter-spacing="2" fill="#F05A3B">03 / GROW</text>
 <text x="995" y="1450" font-family="Arial" font-size="25" font-weight="900" fill="#17201B">See your progress</text>
 <text x="995" y="1490" font-family="Arial" font-size="16" fill="#687269">Keep track of your wins and</text><text x="995" y="1517" font-family="Arial" font-size="16" fill="#687269">build momentum over time.</text>
</g>
<!-- CTA -->
<g id="CallToAction">
